sonar.projectKey=EduSmartX_educard-clients
sonar.organization=edusmartx
sonar.projectName=educard-clients

sonar.sources=apps/web/src,apps/mobile/src,apps/mobile/app,packages/shared/src
sonar.tests=apps/web/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/.expo/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/generated/**

sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.config.*,**/types/**,**/*.d.ts

sonar.sourceEncoding=UTF-8

# Exclude rules that conflict with TypeScript ESLint best practices
# S3735: "void" operator is the standard pattern for @typescript-eslint/no-floating-promises
# S4123: Related void operator usage in conditional contexts
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4123
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
