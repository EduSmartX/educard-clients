name: Mobile APK Build

on:
  push:
    branches:
      - develop
      - development
  workflow_dispatch:

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prechecks:
    name: Optional Mobile Checks (Non Blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint mobile (non-blocking)
        run: pnpm --filter @educard/mobile lint

      - name: Typecheck mobile (non-blocking)
        run: pnpm --filter @educard/mobile typecheck

  build-apk:
    name: Build Android APK for Testers
    runs-on: ubuntu-latest
    needs: [prechecks]
    if: ${{ always() }}

    # Secrets are not allowed in step-level `if:`, so expose them as job env.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release env file (dev backend)
        run: |
          cat > apps/mobile/.env.production <<'EOF'
          API_URL=${{ secrets.MOBILE_API_URL_DEV }}
          APP_ENV=development
          SENTRY_DSN=
          POSTHOG_KEY=
          POSTHOG_HOST=
          EOF

      - name: Prepare Android keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/release.keystore
          echo "ANDROID_KEYSTORE_PATH=app/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=release keystore" >> "$GITHUB_ENV"

      - name: Build Android release APK (Gradle)
        run: |
          cd apps/mobile/android
          ./gradlew clean assembleRelease

      - name: Copy APK to workspace root
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk educard-mobile-dev-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: educard-mobile-dev-release-apk
          path: educard-mobile-dev-release.apk
          retention-days: 14

      - name: Build summary
        run: |
          echo "## Android APK Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build system: React Native CLI + Gradle" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: ${SIGNING_MODE:-debug keystore fallback (internal installs only)}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download the APK from workflow artifacts: educard-mobile-dev-release-apk" >> "$GITHUB_STEP_SUMMARY"
